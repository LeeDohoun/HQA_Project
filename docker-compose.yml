# ==========================================
# HQA - Docker Compose
# ==========================================
# 서비스 구성:
#   - backend: Spring Boot 백엔드 (port 8000) - 인증/KIS/주문 집행
#   - ai:      AI 서버 (port 8001)            - LLM/RAG/에이전트
#   - frontend: Next.js 프론트엔드 (port 3000)
#   - redis:  Task Queue 브로커 + 캐시
#   - postgres: 로컬 개발 DB
# ==========================================

services:
  # ── Spring Boot Backend ──
  backend:
    image: maven:3.9-eclipse-temurin-17
    container_name: hqa-backend
    working_dir: /workspace
    ports:
      - "${PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      - ENV=local
      - PORT=8000
      - DATABASE_URL=jdbc:postgresql://postgres:5432/hqa
      - DATABASE_USERNAME=hqa
      - DATABASE_PASSWORD=hqa_password
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - AI_SERVER_URL=http://ai:8001
      - HQA_INTERNAL_TOKEN=${HQA_INTERNAL_TOKEN:-}
      - HQA_KIS_ENC_KEY=${HQA_KIS_ENC_KEY:-local-dev-change-me}
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      ai:
        condition: service_healthy
    volumes:
      - ./backend:/workspace
      - maven-cache:/root/.m2
    command: mvn -B spring-boot:run
    restart: unless-stopped
    networks:
      - hqa-network

  # ── Next.js Frontend ──
  frontend:
    image: node:22-alpine
    container_name: hqa-frontend
    working_dir: /workspace
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_BASE=http://localhost:8000
    depends_on:
      - backend
    volumes:
      - ./frontend:/workspace
      - frontend-node-modules:/workspace/node_modules
    command: sh -c "npm install --no-audit --no-fund && npm run dev -- -H 0.0.0.0"
    restart: unless-stopped
    networks:
      - hqa-network

  # ── AI Server (LLM/RAG/에이전트 전용) ──
  ai:
    build:
      context: .
      dockerfile: ai_server/Dockerfile
    container_name: hqa-ai
    ports:
      - "8001:8001"
    env_file:
      - .env
    environment:
      - ENV=production
      - PORT=8001
      - REDIS_URL=redis://redis:6379/0
      - LLM_PROVIDER=openai
      - HQA_DATA_DIR=/app/data
      - HQA_LLM_BUDGET_PATH=/app/data/llm_budget.sqlite3
      - HQA_PAPER_AUDIT_PATH=/app/data/paper_audit.sqlite3
      - BACKEND_INTERNAL_BASE_URL=http://backend:8000
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - hqa-data:/app/data
    restart: unless-stopped
    networks:
      - hqa-network

  # These workers are opt-in; analysis remains inside the single AI service.
  analysis-scheduler:
    profiles: ["paper"]
    build:
      context: .
      dockerfile: ai_server/Dockerfile
    env_file:
      - .env
    environment:
      - AI_SERVER_URL=http://ai:8001
    command: ["python", "-m", "src.runner.analysis_scheduler", "--forever"]
    healthcheck:
      disable: true
    depends_on:
      ai:
        condition: service_healthy
      backend:
        condition: service_started
    restart: unless-stopped
    networks:
      - hqa-network

  signal-monitor:
    profiles: ["paper"]
    build:
      context: .
      dockerfile: ai_server/Dockerfile
    env_file:
      - .env
    environment:
      - BACKEND_INTERNAL_BASE_URL=http://backend:8000
      - HQA_DATA_DIR=/app/data
      - HQA_PAPER_AUDIT_PATH=/app/data/paper_audit.sqlite3
    command: ["python", "-m", "src.runner.signal_monitor"]
    volumes:
      - hqa-data:/app/data
    healthcheck:
      disable: true
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - hqa-network

  # ── Redis ──
  redis:
    image: redis:7-alpine
    container_name: hqa-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    networks:
      - hqa-network

  # ── PostgreSQL ──
  postgres:
    image: postgres:16-alpine
    container_name: hqa-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: hqa
      POSTGRES_USER: hqa
      POSTGRES_PASSWORD: hqa_password
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hqa"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    networks:
      - hqa-network

volumes:
  hqa-data:
  maven-cache:
  frontend-node-modules:
  redis-data:
  postgres-data:

networks:
  hqa-network:
    driver: bridge
