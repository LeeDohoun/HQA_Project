server:
  port: ${PORT:8000}
  forward-headers-strategy: framework
  servlet:
    session:
      cookie:
        same-site: ${SESSION_COOKIE_SAME_SITE:lax}
        secure: ${SESSION_COOKIE_SECURE:false}

spring:
  application:
    name: hqa-backend
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/hqa}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      # validate: Hibernate only checks that entities match the schema and
      # refuses to start on mismatch. All schema changes must go through
      # Flyway migrations under src/main/resources/db/migration/.
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    # The existing database was created by Hibernate ddl-auto before Flyway
    # was introduced. baseline-on-migrate marks V1 as already applied for
    # such DBs; for fresh DBs Flyway runs V1 normally because baseline only
    # kicks in when the schema_history table is missing.
    baseline-on-migrate: true
    baseline-version: 1
    validate-on-migrate: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  jackson:
    serialization:
      write-dates-as-timestamps: false
    property-naming-strategy: SNAKE_CASE

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info

hqa:
  env: ${ENV:local}
  app-version: ${APP_VERSION:1.0.0}
  cors-origins: ${CORS_ORIGINS:http://localhost:3000,http://localhost:8501}
  secret-key: ${SECRET_KEY:change-me-in-production}
  rate-limit-per-minute: ${RATE_LIMIT_PER_MINUTE:30}
  ai-server-url: ${AI_SERVER_URL:http://localhost:8001}
  internal-token: ${HQA_INTERNAL_TOKEN:}
  redis-url: ${REDIS_URL:redis://localhost:6379/0}
  kis-app-key: ${KIS_APP_KEY:}
  kis-app-secret: ${KIS_APP_SECRET:}
  kis-account-no: ${KIS_ACCOUNT_NO:}
  kis-enc-key: ${HQA_KIS_ENC_KEY:}
  historical-data-dir: ${HQA_HISTORICAL_DATA_DIR:}
  # KRX weekday closures and official special sessions for PAPER order gating; keep in step
  # with src/runner/trading_calendar.py, e.g. HQA_KRX_SPECIAL_SESSIONS=2026-11-19@10:00-16:30
  # The default lists that calendar's weekday closures from 2026-10 through its review
  # horizon (CALENDAR_REVIEWED_THROUGH = 2027-09-30); setting the variable replaces it.
  krx-closed-dates: ${HQA_KRX_CLOSED_DATES:2026-10-05,2026-10-09,2026-12-25,2026-12-31,2027-01-01,2027-02-08,2027-02-09,2027-03-01,2027-05-05,2027-05-13,2027-08-16,2027-09-14,2027-09-15,2027-09-16}
  krx-special-sessions: ${HQA_KRX_SPECIAL_SESSIONS:}
