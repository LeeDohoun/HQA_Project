server:
  port: ${PORT:8000}
  forward-headers-strategy: framework
  servlet:
    session:
      cookie:
        same-site: ${SESSION_COOKIE_SAME_SITE:lax}
        secure: ${SESSION_COOKIE_SECURE:false}

spring:
  application:
    name: hqa-backend
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/hqa}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      # validate: Hibernate only checks that entities match the schema and
      # refuses to start on mismatch. All schema changes must go through
      # Flyway migrations under src/main/resources/db/migration/.
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    # The existing database was created by Hibernate ddl-auto before Flyway
    # was introduced. baseline-on-migrate marks V1 as already applied for
    # such DBs; for fresh DBs Flyway runs V1 normally because baseline only
    # kicks in when the schema_history table is missing.
    baseline-on-migrate: true
    baseline-version: 1
    validate-on-migrate: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  jackson:
    serialization:
      write-dates-as-timestamps: false
    property-naming-strategy: SNAKE_CASE

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info

hqa:
  env: ${ENV:local}
  app-version: ${APP_VERSION:1.0.0}
  cors-origins: ${CORS_ORIGINS:http://localhost:3000,http://localhost:8501}
  secret-key: ${SECRET_KEY:change-me-in-production}
  rate-limit-per-minute: ${RATE_LIMIT_PER_MINUTE:30}
  ai-server-url: ${AI_SERVER_URL:http://localhost:8001}
  internal-token: ${HQA_INTERNAL_TOKEN:}
  redis-url: ${REDIS_URL:redis://localhost:6379/0}
  kis-app-key: ${KIS_APP_KEY:}
  kis-app-secret: ${KIS_APP_SECRET:}
  kis-account-no: ${KIS_ACCOUNT_NO:}
  kis-enc-key: ${HQA_KIS_ENC_KEY:}
  historical-data-dir: ${HQA_HISTORICAL_DATA_DIR:}
  # KRX weekday closures and official special sessions for PAPER order gating; keep in step
  # with src/runner/trading_calendar.py, e.g. HQA_KRX_SPECIAL_SESSIONS=2026-11-19@10:00-16:30
  # Unset or blank uses KrxSessionCalendar.DEFAULT_CLOSED_DATES (that calendar's weekday
  # closures from 2026-10 through its review horizon); a nonblank value replaces it.
  krx-closed-dates: ${HQA_KRX_CLOSED_DATES:}
  krx-special-sessions: ${HQA_KRX_SPECIAL_SESSIONS:}
  # M8 strategy runtime (docs/strategy-runtime.md). orders-enabled is the master switch: while false
  # the batch executor sends nothing and accepted batches stay QUEUED. Windows are regular-session
  # KST times with an exclusive end; on a special session they shift with its open/close.
  strategy:
    orders-enabled: ${HQA_STRATEGY_ORDERS_ENABLED:false}
    order-type: ${HQA_STRATEGY_ORDER_TYPE:MARKET}
    open-window: ${HQA_STRATEGY_OPEN_WINDOW:08:30-08:59}
    close-window: ${HQA_STRATEGY_CLOSE_WINDOW:15:20-15:29}
    open-cancel-after: ${HQA_STRATEGY_OPEN_CANCEL_AFTER:09:05}
    executor-poll-ms: ${HQA_STRATEGY_EXECUTOR_POLL_MS:2000}
    reconcile-poll-ms: ${HQA_STRATEGY_RECONCILE_POLL_MS:20000}
    daily-loss-limit-pct: ${HQA_STRATEGY_DAILY_LOSS_LIMIT_PCT:2.0}
    drawdown-stop-pct: ${HQA_STRATEGY_DRAWDOWN_STOP_PCT:10.0}
    full-review-pct: ${HQA_STRATEGY_FULL_REVIEW_PCT:15.0}
    max-orders-per-day: ${HQA_STRATEGY_MAX_ORDERS_PER_DAY:1500}
    max-cancel-ratio: ${HQA_STRATEGY_MAX_CANCEL_RATIO:0.5}
    max-order-pct-of-equity: ${HQA_STRATEGY_MAX_ORDER_PCT_OF_EQUITY:10.0}
    max-orders-per-batch: ${HQA_STRATEGY_MAX_ORDERS_PER_BATCH:1000}
    risk-recheck-seconds: ${HQA_STRATEGY_RISK_RECHECK_SECONDS:300}
    executor-tick-budget-ms: ${HQA_STRATEGY_EXECUTOR_TICK_BUDGET_MS:10000}
    # Strategy batches fail closed (CALENDAR_UNVERIFIED) after the reviewed calendar horizon and on
    # announced special-session dates until HQA_KRX_SPECIAL_SESSIONS configures them.
    calendar-reviewed-through: ${HQA_STRATEGY_CALENDAR_REVIEWED_THROUGH:2027-09-30}
    pending-special-sessions: ${HQA_STRATEGY_PENDING_SPECIAL_SESSIONS:2026-11-19}
